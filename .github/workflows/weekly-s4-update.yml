name: Weekly S4 update

# Runs the full Baller League UK pipeline after Monday-night matchdays and
# commits the refreshed data + generated content. Netlify deploys on the push.
#
# NOTE: this needs no extra secret — it uses the built-in GITHUB_TOKEN with
# `contents: write`. If the site repo moves, or you want the push to trigger
# other GitHub workflows, swap in a fine-grained PAT secret instead.

on:
  schedule:
    # Mondays 23:30 UTC (~after the final whistle of the Monday matchday).
    - cron: "30 23 * * 1"
    # Tuesday 08:00 UTC — safety net if the Monday run was too early or missed.
    - cron: "0 8 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: weekly-s4-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Run full update (scrape → generate → verify → build)
        id: update1
        continue-on-error: true
        run: npm run update

      # A single failed page fetch should not leave the site stale. The update is
      # idempotent, so one clean retry is safe.
      - name: Retry full update after a transient failure
        if: steps.update1.outcome == 'failure'
        run: npm run update

      - name: Open an issue if the update failed
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Automated GW update failed";
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100,
            });
            if (issues.some((i) => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: `The scheduled update failed. [View the run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).\n\nUsually this means the upstream site changed something (e.g. team names) or a scrape was incomplete. Check which pipeline stage failed in the log, fix it, then close this issue.`,
            });

      - name: Commit and push if anything changed
        run: |
          git config user.name "baller-hub-bot"
          git config user.email "actions@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore: automated weekly update"
            git push
          else
            echo "No changes to commit."
          fi
