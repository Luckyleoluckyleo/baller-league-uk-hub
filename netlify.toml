[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/compare"
  to = "/rules"
  status = 301

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Legacy manager slug generated before the name -> content-file mapping existed.
[[redirects]]
  from = "/managers/tobi-brown-tbjzl"
  to = "/managers/tobi-brown"
  status = 301

# Legacy player slug from an older players.json scrape.
[[redirects]]
  from = "/players/charlie-james-pavey"
  to = "/players/charlie-pavey/"
  status = 301

[[redirects]]
  from = "/players/charlie-james-pavey/"
  to = "/players/charlie-pavey/"
  status = 301

# Old preview/report URLs that were removed. Point them at the live report or
# match page rather than leaving a crawlable 404.
